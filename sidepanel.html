<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>메모장</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="app-header">
    <!-- 타이틀 자리의 오늘의 사자성어. 글자와 뜻은 idioms.js에서 골라 JS가 채운다.
         말풍선을 h1 밖에 두는 이유: h1은 말줄임 때문에 overflow가 막혀 있어
         안에 두면 말풍선이 잘린다. -->
    <div class="brand">
      <h1>
        <span aria-hidden="true">📝</span>
        <span class="idiom-label">사자성어</span>
        <a id="idiom" class="idiom" href="https://hanja.dict.naver.com/#/main"
           target="_blank" rel="noopener" aria-describedby="idiom-tip">適者生存</a>
      </h1>
      <div id="idiom-tip" class="idiom-tip" role="tooltip">
        <span class="idiom-tip-title">오늘의 사자성어</span>
        <strong id="idiom-reading" class="idiom-reading">적자생존</strong>
        <span id="idiom-meaning" class="idiom-meaning">환경에 가장 잘 적응하는 것만이 살아남음</span>
        <span class="idiom-hint">클릭하면 네이버 한자사전에서 보기</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="format-menu">
        <button id="format-btn" class="btn btn-icon btn-quiet" type="button"
                aria-haspopup="true" aria-expanded="false" aria-label="글씨체 설정"
                title="글씨체 설정">
          <span class="format-icon" aria-hidden="true">가</span>
        </button>
        <div id="format-popover" class="format-popover" hidden>
          <div class="format-row" role="group" aria-label="글씨 스타일">
            <button type="button" class="format-toggle" data-cmd="bold"
                    title="굵게 (Ctrl+B)" aria-label="굵게" aria-pressed="false"><b>B</b></button>
            <button type="button" class="format-toggle" data-cmd="italic"
                    title="기울임 (Ctrl+I)" aria-label="기울임" aria-pressed="false"><i>I</i></button>
            <button type="button" class="format-toggle" data-cmd="underline"
                    title="밑줄 (Ctrl+U)" aria-label="밑줄" aria-pressed="false"><u>U</u></button>
          </div>
          <div class="format-colors" role="group" aria-label="글자 색"></div>
          <p class="format-hint">메모 내용을 선택하면 적용됩니다.</p>
        </div>
      </div>
      <button id="theme-btn" class="btn btn-icon btn-quiet" type="button" aria-label="테마 변경"></button>
      <button id="add-note-btn" class="btn btn-icon btn-primary" type="button"
              title="새 메모 추가" aria-label="새 메모 추가">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5.5v13M5.5 12h13" />
        </svg>
      </button>
    </div>
  </header>

  <main id="notes-list" class="notes-list"></main>

  <p id="empty-state" class="empty-state" hidden>
    메모가 없습니다.<br />오른쪽 위 + 버튼을 눌러 시작하세요.
  </p>

  <template id="note-template">
    <section class="note">
      <div class="note-header">
        <span class="note-handle" draggable="true" title="드래그하여 순서 변경">⠿</span>
        <input class="note-title" type="text" placeholder="제목 없음" maxlength="80" spellcheck="false" />
        <button class="note-delete" title="메모 삭제">✕</button>
      </div>
      <!-- textarea가 아니라 contenteditable인 이유: Ctrl+B로 일부 글자만 굵게
           만들려면 서식을 담을 수 있는 요소여야 한다. placeholder 속성이 없으므로
           data-placeholder + .is-blank 클래스로 흉내 낸다(sidepanel.css 참고). -->
      <div class="note-content" contenteditable="true" role="textbox" aria-multiline="true"
           aria-label="메모 내용" spellcheck="false"
           data-placeholder="메모를 입력하세요..."></div>
      <div class="note-footer">
        <div class="color-swatches"></div>
        <div class="note-meta">
          <!-- 알림 설정은 종 버튼을 누르면 열리는 작은 패널에서 한다(시각, 소리,
               지우기). 푸터에는 종과 정해 둔 시각만 남긴다. -->
          <span class="note-reminder">
            <button type="button" class="note-reminder-btn" aria-haspopup="true"
                    aria-expanded="false" aria-label="알림 설정" title="알림 설정">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 9.5a6 6 0 0 1 12 0c0 5.2 2 6.5 2 6.5H4s2-1.3 2-6.5z" />
                <path d="M10 19.5a2.2 2.2 0 0 0 4 0" />
              </svg>
              <span class="note-reminder-text"></span>
              <!-- 알림이 걸려 있고 소리가 꺼져 있을 때만 보이는 표시 -->
              <svg class="note-reminder-muted" viewBox="0 0 24 24" width="12" height="12" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round" aria-hidden="true">
                <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" />
                <path d="M16 9.5l5 5M21 9.5l-5 5" />
              </svg>
            </button>
            <div class="note-reminder-popover" role="group" aria-label="알림 설정" hidden>
              <span class="reminder-title">알림 설정</span>
              <label class="reminder-field">
                <span>알림 시각</span>
                <input type="datetime-local" class="note-reminder-input" />
              </label>
              <label class="reminder-row">
                <input type="checkbox" class="note-reminder-sound" checked />
                <span>알림 소리</span>
              </label>
              <button type="button" class="note-reminder-clear" disabled>알림 지우기</button>
            </div>
          </span>
          <span class="note-date"></span>
        </div>
      </div>
    </section>
  </template>

  <script src="idioms.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
